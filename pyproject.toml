[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
  "services/fleet-manager/tests",
  "services/telemetry-service/tests",
  "services/mission-service/tests"
]
pythonpath = [
  "services/fleet-manager",
  "services/telemetry-service",
  "services/mission-service"
]
addopts = "-ra"

[tool.bandit]
exclude_dirs = [
  "tests",
  ".venv"
]
skips = []