global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "fleet-manager"
    metrics_path: /metrics
    static_configs:
      - targets: ["fleet-manager:8000"]

  - job_name: "telemetry-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["telemetry-service:8000"]

  - job_name: "mission-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["mission-service:8000"]