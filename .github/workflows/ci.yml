name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check services edge-agent

      - name: Run Ruff format check
        run: ruff format --check services edge-agent

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs:
      - lint

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: fleet-manager
            path: services/fleet-manager
          - name: telemetry-service
            path: services/telemetry-service
          - name: mission-service
            path: services/mission-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ${{ matrix.service.path }}/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ matrix.service.path }}
        run: pytest ${{ matrix.service.path }}/tests

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start platform
        run: docker compose up --build -d

      - name: Wait for services
        run: sleep 20

      - name: Check service health
        run: |
          curl -fsS http://localhost:8001/health
          curl -fsS http://localhost:8002/health
          curl -fsS http://localhost:8003/health

      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Shutdown platform
        if: always()
        run: docker compose down